services:
  postgres-vector:
    image: pgvector/pgvector:pg16
    container_name: agentic_rag_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-agentic_rag}
    ports:
      - "5432:5432"
    volumes:
      - ./data/docker_volumes/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  neo4j-graph:
    image: neo4j:5
    container_name: agentic_rag_neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-neo4j_password_123}
      # Cho phép APOC plugin (nếu cần xử lý đồ thị nâng cao sau này)
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    volumes:
      - ./data/docker_volumes/neo4j/data:/data
      - ./data/docker_volumes/neo4j/plugins:/plugins
    restart: unless-stopped

  redis-queue:
    image: redis:7-alpine
    container_name: agentic_rag_redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/docker_volumes/redis:/data
    restart: unless-stopped
